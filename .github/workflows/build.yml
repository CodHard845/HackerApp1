name: Compiler App iOS

on: [push]

jobs:
  build:
  # GitHub met un vrai Mac à dispo gratuitement pour les repos publics !
    runs-on: macos-latest 
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Compiler le code Swift
        run: |
          swiftc main.swift -o HackerApp
          mkdir Output
          mv HackerApp Output/

      - name: Sauvegarder l'application compilée
        uses: actions/upload-artifact@v4
        with:
          name: MonAppCompileur
          path: Output/
